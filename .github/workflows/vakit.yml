# Her pazartesi 81 ilin Diyanet namaz vakitlerini yeniler (Diyanet sitesiyle doğrular).
name: Namaz vakitleri

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vakit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vakitleri indir ve doğrula
        run: python3 gonderici/vakit_indir.py
      - name: Yükle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vakitler
          git diff --cached --quiet || { git commit -m "Namaz vakitleri güncellendi"; git pull --rebase -q; git push; }
