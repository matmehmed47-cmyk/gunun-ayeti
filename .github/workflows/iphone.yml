# Her gece 00:05 (Türkiye) iPhone kestirmesinin indireceği bugünün ayet resmini üretir.
name: iPhone günlük resim

on:
  schedule:
    - cron: '5 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resmi üret
        run: |
          pip install -q pillow
          curl -sL -o /tmp/literata.ttf "https://github.com/google/fonts/raw/main/ofl/literata/Literata%5Bopsz,wght%5D.ttf"
          python3 gonderici/iphone_resim.py /tmp/literata.ttf
      - name: Yükle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iphone
          git diff --cached --quiet || { git commit -m "iPhone: bugünün ayet resmi"; git push; }
